<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>تقسيم PDF إلى صور - دقة عالية وحجم صغير</title>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; padding: 2rem 1rem; margin: 0; }
        .container { max-width: 1100px; width: 100%; background: white; border-radius: 28px; padding: 2rem; box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        h1 { font-size: 2rem; color: #1e293b; margin-top: 0; text-align: center; }
        .upload-area { border: 3px dashed #cbd5e1; border-radius: 20px; padding: 2.5rem; text-align: center; cursor: pointer; transition: 0.3s; background: #f8fafc; }
        .upload-area:hover { border-color: #3b82f6; background: #eff6ff; transform: scale(1.01); }
        .upload-area input { display: none; }
        .controls { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; margin: 1.5rem 0; background: #f1f5f9; padding: 1rem; border-radius: 60px; }
        .range-box { display: flex; align-items: center; gap: 8px; }
        .range-box input { width: 70px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 12px; text-align: center; font-size: 1rem; }
        .quality-box { display: flex; align-items: center; gap: 10px; background: white; padding: 0.3rem 1rem; border-radius: 40px; border: 1px solid #cbd5e1; }
        .quality-box select { padding: 6px 12px; border: none; border-radius: 20px; background: #f8fafc; font-weight: bold; cursor: pointer; }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px 28px; border-radius: 40px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn:hover { background: #2563eb; transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; }
        .btn-telegram { background: #0088cc; }
        .btn-telegram:hover { background: #006699; }
        .btn-whatsapp { background: #25D366; }
        .btn-whatsapp:hover { background: #1da851; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 1.2rem 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 16px; margin-top: 20px; max-height: 600px; overflow-y: auto; padding: 10px; background: #f8fafc; border-radius: 16px; }
        .gallery img { width: 100%; border-radius: 12px; border: 2px solid #e2e8f0; box-shadow: 0 4px 8px rgba(0,0,0,0.05); transition: 0.2s; cursor: pointer; }
        .gallery img:hover { transform: scale(1.05); border-color: #3b82f6; }
        .status { background: #f1f5f9; padding: 0.8rem 1.5rem; border-radius: 40px; text-align: center; margin: 1rem 0; color: #334155; font-weight: 500; }
        .badge { display: inline-block; background: #3b82f6; color: white; padding: 2px 12px; border-radius: 20px; font-size: 0.8rem; margin-right: 8px; }
        .size-info { font-size: 0.9rem; color: #1e293b; margin-top: 5px; padding: 10px; background: #f8fafc; border-radius: 12px; }
        .footer-note { font-size: 0.85rem; color: #64748b; text-align: center; margin-top: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 1rem; }
        .highlight { color: #3b82f6; font-weight: bold; }
        @media (max-width: 600px) { .controls { flex-direction: column; border-radius: 20px; } .range-box { width: 100%; justify-content: center; } }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 PDF → صور بدقة عالية</h1>

    <div class="upload-area" id="uploadArea">
        <p style="margin:0; font-size:1.4rem;">📤 اضغط لرفع PDF</p>
        <p style="margin:6px 0 0; color:#64748b;">أو اسحب الملف إلى هنا</p>
        <input type="file" id="fileInput" accept=".pdf" />
    </div>

    <div class="controls">
        <div class="range-box">
            <span>من</span>
            <input type="number" id="startPage" value="1" min="1" />
            <span>إلى</span>
            <input type="number" id="endPage" value="1" min="1" />
        </div>
        <div class="quality-box">
            <span>📐 الدقة:</span>
            <select id="qualitySelect">
                <option value="3.0">فائقة (3x)</option>
                <option value="2.5">عالية جداً (2.5x)</option>
                <option value="2.0" selected>عالية (2x)</option>
                <option value="1.8">متوسطة عالية (1.8x)</option>
                <option value="1.5">متوسطة (1.5x)</option>
                <option value="1.2">منخفضة (1.2x)</option>
            </select>
        </div>
        <button class="btn" id="processBtn">🔄 تقسيم وعرض</button>
    </div>

    <div class="status" id="statusMsg">📤 ارفع ملف PDF للبدء</div>

    <!-- أزرار التصدير -->
    <div class="btn-group" id="exportBtns" style="display:none;">
        <button class="btn btn-whatsapp" id="whatsappBtn">📱 واتساب</button>
        <button class="btn btn-telegram" id="telegramBtn">✈️ تلغرام</button>
        <button class="btn btn-success" id="downloadZipBtn">📦 ZIP</button>
        <button class="btn btn-warning" id="exportPdfBtn">📑 PDF</button>
        <button class="btn btn-danger" id="compressBtn">🗜️ ضغط إضافي</button>
    </div>

    <div class="gallery" id="gallery"></div>
    <div class="size-info" id="sizeInfo"></div>
    <div class="footer-note">
        <span class="badge">JPEG عالي الجودة</span> دقة كتابة ممتازة • حجم صغير • <span class="badge">ZIP</span> ضغط • <span class="badge">PDF</span> دمج
    </div>
</div>

<script>
    (function() {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const processBtn = document.getElementById('processBtn');
        const startPageInput = document.getElementById('startPage');
        const endPageInput = document.getElementById('endPage');
        const qualitySelect = document.getElementById('qualitySelect');
        const gallery = document.getElementById('gallery');
        const statusMsg = document.getElementById('statusMsg');
        const sizeInfo = document.getElementById('sizeInfo');
        const exportBtns = document.getElementById('exportBtns');
        const whatsappBtn = document.getElementById('whatsappBtn');
        const telegramBtn = document.getElementById('telegramBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        const compressBtn = document.getElementById('compressBtn');

        let pdfDoc = null;
        let totalPages = 0;
        let generatedImages = []; // { pageNum, dataURL, size, format }
        let originalFileSize = 0;
        let currentQuality = 0.92; // جودة JPEG

        // تحديث نطاق الصفحات
        function updateRange() {
            if (totalPages > 0) {
                startPageInput.max = totalPages;
                endPageInput.max = totalPages;
                let s = parseInt(startPageInput.value) || 1;
                let e = parseInt(endPageInput.value) || totalPages;
                if (s < 1) s = 1;
                if (e > totalPages) e = totalPages;
                if (s > totalPages) s = totalPages;
                if (e < 1) e = 1;
                startPageInput.value = s;
                endPageInput.value = e;
            }
        }

        // تحويل الصورة إلى JPEG بجودة محددة
        function convertToJPEG(dataURL, quality = 0.92) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = dataURL;
            });
        }

        // حساب حجم الصورة بالكيلوبايت
        function getImageSize(dataURL) {
            const base64 = dataURL.split(',')[1];
            const bytes = atob(base64).length;
            return Math.round(bytes / 1024);
        }

        // رفع الملف
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#3b82f6'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#cbd5e1'; });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#cbd5e1';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                statusMsg.innerText = '❌ يرجى رفع ملف PDF صالح';
                return;
            }
            originalFileSize = file.size;
            statusMsg.innerText = `⏳ جاري تحميل الملف (${(originalFileSize/1024).toFixed(1)} KB)...`;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    pdfDoc = await pdfjsLib.getDocument({ data: ev.target.result }).promise;
                    totalPages = pdfDoc.numPages;
                    updateRange();
                    statusMsg.innerText = `✅ تم تحميل PDF، عدد الصفحات: ${totalPages}`;
                    startPageInput.value = 1;
                    endPageInput.value = totalPages;
                    processBtn.disabled = false;
                    gallery.innerHTML = '';
                    generatedImages = [];
                    exportBtns.style.display = 'none';
                    sizeInfo.innerText = '';
                } catch (err) {
                    console.error(err);
                    statusMsg.innerText = '❌ خطأ في قراءة PDF';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // معالجة وتحويل الصفحات مع الحفاظ على دقة النصوص
        processBtn.addEventListener('click', async () => {
            if (!pdfDoc) {
                statusMsg.innerText = '⚠️ يرجى رفع ملف PDF أولاً';
                return;
            }

            let start = parseInt(startPageInput.value) || 1;
            let end = parseInt(endPageInput.value) || totalPages;
            if (start < 1) start = 1;
            if (end > totalPages) end = totalPages;
            if (start > end) [start, end] = [end, start];
            startPageInput.value = start;
            endPageInput.value = end;

            const scale = parseFloat(qualitySelect.value);
            statusMsg.innerText = `⏳ جاري معالجة الصفحات ${start} - ${end} بدقة ${scale}x ...`;
            processBtn.disabled = true;
            gallery.innerHTML = '';
            generatedImages = [];
            sizeInfo.innerText = '';

            try {
                let totalSize = 0;
                for (let pageNum = start; pageNum <= end; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: scale });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    // تحسين جودة النصوص عن طريق تعيين خيارات rendering
                    await page.render({ 
                        canvasContext: context, 
                        viewport: viewport,
                        // تحسين جودة النصوص
                        intent: 'display'
                    }).promise;
                    
                    // تحويل PNG إلى JPEG بجودة عالية للحفاظ على النصوص
                    const pngDataURL = canvas.toDataURL('image/png');
                    const jpegDataURL = await convertToJPEG(pngDataURL, 0.92);
                    const sizeKB = getImageSize(jpegDataURL);
                    totalSize += sizeKB;
                    
                    generatedImages.push({ 
                        pageNum, 
                        dataURL: jpegDataURL, 
                        sizeKB,
                        format: 'JPEG (92%)'
                    });

                    const img = document.createElement('img');
                    img.src = jpegDataURL;
                    img.alt = `صفحة ${pageNum}`;
                    img.title = `صفحة ${pageNum} - ${sizeKB} KB - JPEG عالي الجودة`;
                    img.addEventListener('click', () => {
                        const link = document.createElement('a');
                        link.download = `page_${pageNum}.jpg`;
                        link.href = jpegDataURL;
                        link.click();
                    });
                    gallery.appendChild(img);
                }

                const avgSize = Math.round(totalSize / generatedImages.length);
                const totalMB = (totalSize / 1024).toFixed(2);
                const originalMB = (originalFileSize / (1024 * 1024)).toFixed(2);
                const ratio = ((totalSize / (originalFileSize / 1024)) * 100).toFixed(1);
                
                sizeInfo.innerHTML = `
                    📊 <strong>إحصائيات:</strong> 
                    ${generatedImages.length} صفحة | 
                    الصيغة: <span class="highlight">JPEG بجودة 92%</span> | 
                    متوسط الحجم: ${avgSize} KB | 
                    الحجم الكلي: ${totalMB} MB | 
                    نسبة إلى الملف الأصلي (${originalMB} MB): <strong style="color: ${ratio < 60 ? 'green' : ratio < 80 ? 'orange' : 'red'}">${ratio}%</strong>
                    ${ratio < 60 ? ' ✅ (أصغر من النصف مع دقة ممتازة!)' : ratio < 80 ? ' ⚠️ (حجم متوسط)' : ' ❌ (حجم كبير، حاول ضغط إضافي)'}
                    <br><span style="font-size:0.85rem; color:#64748b;">💡 النصوص واضحة بفضل تقنية JPEG بجودة عالية</span>
                `;

                statusMsg.innerText = `✅ تم تحويل ${generatedImages.length} صفحة (JPEG عالي الجودة)`;
                exportBtns.style.display = 'flex';
            } catch (err) {
                console.error(err);
                statusMsg.innerText = '❌ حدث خطأ أثناء التحويل';
            } finally {
                processBtn.disabled = false;
            }
        });

        // --- ضغط إضافي (جودة أقل مع الحفاظ على النصوص) ---
        compressBtn.addEventListener('click', async () => {
            if (generatedImages.length === 0) {
                statusMsg.innerText = '⚠️ لا توجد صور للضغط';
                return;
            }

            if (!confirm(`سيتم ضغط ${generatedImages.length} صورة بجودة 75% مع الحفاظ على وضوح النصوص. هل تريد المتابعة؟`)) return;

            statusMsg.innerText = '⏳ جاري ضغط الصور مع الحفاظ على النصوص...';
            const compressed = [];

            try {
                for (let i = 0; i < generatedImages.length; i++) {
                    const img = generatedImages[i];
                    // إعادة تحويل بجودة أقل مع الحفاظ على الدقة
                    const compressedDataURL = await convertToJPEG(img.dataURL, 0.75);
                    const sizeKB = getImageSize(compressedDataURL);
                    compressed.push({ 
                        pageNum: img.pageNum, 
                        dataURL: compressedDataURL, 
                        sizeKB,
                        format: 'JPEG (75%)'
                    });
                }

                // استبدال الصور القديمة بالمضغوطة
                generatedImages = compressed;
                
                // تحديث المعرض
                gallery.innerHTML = '';
                let totalSize = 0;
                for (const img of generatedImages) {
                    totalSize += img.sizeKB;
                    const el = document.createElement('img');
                    el.src = img.dataURL;
                    el.alt = `صفحة ${img.pageNum}`;
                    el.title = `صفحة ${img.pageNum} (${img.sizeKB} KB) - JPEG 75%`;
                    el.addEventListener('click', () => {
                        const link = document.createElement('a');
                        link.download = `page_${img.pageNum}_compressed.jpg`;
                        link.href = img.dataURL;
                        link.click();
                    });
                    gallery.appendChild(el);
                }

                const totalMB = (totalSize / 1024).toFixed(2);
                const originalMB = (originalFileSize / (1024 * 1024)).toFixed(2);
                const ratio = ((totalSize / (originalFileSize / 1024)) * 100).toFixed(1);
                
                sizeInfo.innerHTML = `
                    📊 <strong>بعد الضغط (جودة 75%):</strong> 
                    ${generatedImages.length} صفحة | 
                    الصيغة: <span class="highlight">JPEG بجودة 75%</span> | 
                    الحجم الكلي: ${totalMB} MB | 
                    نسبة إلى الملف الأصلي (${originalMB} MB): <strong style="color: ${ratio < 50 ? 'green' : 'orange'}">${ratio}%</strong>
                    ${ratio < 50 ? ' ✅ (أقل من النصف!)' : ''}
                    <br><span style="font-size:0.85rem; color:#64748b;">📝 النصوص لا تزال واضحة بفضل تقنية الضغط الذكية</span>
                `;
                statusMsg.innerText = `✅ تم ضغط ${generatedImages.length} صورة بنجاح (جودة 75%)`;
            } catch (err) {
                console.error(err);
                statusMsg.innerText = '❌ فشل ضغط الصور';
            }
        });

        // --- تصدير إلى واتساب ---
        whatsappBtn.addEventListener('click', () => {
            if (generatedImages.length === 0) return;
            const msg = `📸 تم تحويل ${generatedImages.length} صفحة من PDF إلى صور JPEG عالية الجودة.`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg + ' حمّل الصور من المتصفح.')}`, '_blank');
            statusMsg.innerText = '📱 تم فتح واتساب';
        });

        // --- تصدير إلى تلغرام ---
        telegramBtn.addEventListener('click', () => {
            if (generatedImages.length === 0) return;
            const msg = `📸 تم تحويل ${generatedImages.length} صفحة من PDF إلى صور JPEG عالية الجودة.`;
            window.open(`https://t.me/share/url?url=${encodeURIComponent('PDF to Images')}&text=${encodeURIComponent(msg)}`, '_blank');
            statusMsg.innerText = '✈️ تم فتح تلغرام';
        });

        // --- تحميل ZIP ---
        downloadZipBtn.addEventListener('click', async () => {
            if (generatedImages.length === 0) {
                statusMsg.innerText = '⚠️ لا توجد صور للتحميل';
                return;
            }
            statusMsg.innerText = '⏳ جاري إنشاء ملف ZIP...';
            try {
                const zip = new JSZip();
                for (const img of generatedImages) {
                    const blob = await fetch(img.dataURL).then(r => r.blob());
                    zip.file(`page_${img.pageNum}.jpg`, blob);
                }
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, `pdf_pages_${generatedImages.length}.zip`);
                statusMsg.innerText = `✅ تم تحميل ZIP (${(zipBlob.size/1024).toFixed(1)} KB)`;
            } catch (err) {
                console.error(err);
                statusMsg.innerText = '❌ فشل إنشاء ملف ZIP';
            }
        });

        // --- تصدير إلى PDF جديد ---
        exportPdfBtn.addEventListener('click', async () => {
            if (generatedImages.length === 0) {
                statusMsg.innerText = '⚠️ لا توجد صفحات للتصدير';
                return;
            }
            statusMsg.innerText = '⏳ جاري إنشاء ملف PDF...';
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgWidth = 210;
                let first = true;

                for (const img of generatedImages) {
                    const imgBlob = await fetch(img.dataURL).then(r => r.blob());
                    const imgData = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(imgBlob);
                    });

                    if (!first) pdf.addPage();
                    first = false;

                    const imgHeight = (imgWidth * 297) / 210;
                    pdf.addImage(imgData, 'JPEG', 0, 0, imgWidth, imgHeight);
                }

                pdf.save(`merged_pdf_${generatedImages.length}_pages.pdf`);
                statusMsg.innerText = `✅ تم تصدير ${generatedImages.length} صفحة إلى PDF`;
            } catch (err) {
                console.error(err);
                statusMsg.innerText = '❌ فشل إنشاء ملف PDF';
            }
        });

        // تحديث النطاق
        startPageInput.addEventListener('change', updateRange);
        endPageInput.addEventListener('change', updateRange);

        processBtn.disabled = true;
        statusMsg.innerText = '📤 ارفع ملف PDF للبدء';
    })();
</script>
</body>
</html>
